plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.dagger.hilt.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'kotlin-kapt'
}

android {
    namespace 'com.pixelro.nenoonkiosk'
    compileSdk 36


    defaultConfig {
        applicationId "com.pixelro.nenoonkiosk"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    // 다국어
    androidResources {
        generateLocaleConfig = true
    }
    
    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion = "1.5.13"
    }
    packagingOptions {
        resources {
            excludes += "META-INF/versions/9/OSGI-INF/MANIFEST.MF"
        }
    }
}

dependencies {

    // modules
    implementation project(path: ':data')

    implementation("androidx.core:core-ktx:1.17.0")
    implementation("androidx.activity:activity-compose:1.11.0")
    implementation platform("androidx.compose:compose-bom:2025.10.00")
    implementation("androidx.compose.ui:ui")
    implementation("androidx.compose.ui:ui-tooling-preview")
    implementation("androidx.compose.material:material")
    implementation("androidx.test:core-ktx:1.7.0")
    implementation 'com.android.identity:identity-doctypes-jvm:202411.1'
    implementation 'androidx.compose.material3:material3'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    testImplementation("junit:junit:4.13.2")
    androidTestImplementation("androidx.test.ext:junit:1.3.0")
    androidTestImplementation("androidx.test.espresso:espresso-core:3.7.0")
    androidTestImplementation("androidx.compose.ui:ui-test-junit4:1.9.3")
    debugImplementation("androidx.compose.ui:ui-tooling")
    debugImplementation("androidx.compose.ui:ui-test-manifest")

    // ViewModel
    implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4")

    // Navigation3
    implementation("androidx.navigation3:navigation3-runtime:1.0.0-alpha04")
    implementation("androidx.navigation3:navigation3-ui:1.0.0-alpha04")

    // Animated Navigation
    implementation("com.google.accompanist:accompanist-navigation-animation:0.32.0")

    // Face Detection
    implementation("com.google.mlkit:face-detection:16.1.5")

    // Text Detection
    implementation 'com.google.mlkit:text-recognition:16.0.0'

    // TensorFlow Lite
    implementation 'org.tensorflow:tensorflow-lite:2.16.1'
    implementation 'org.tensorflow:tensorflow-lite-gpu:2.16.1'
    implementation("org.tensorflow:tensorflow-lite-gpu-api:2.16.1")

    // CameraX
    implementation("androidx.camera:camera-core:${camerax_version}")
    implementation("androidx.camera:camera-camera2:${camerax_version}")
    implementation("androidx.camera:camera-lifecycle:${camerax_version}")
    implementation("androidx.camera:camera-video:${camerax_version}")
    implementation("androidx.camera:camera-view:${camerax_version}")
    implementation("androidx.camera:camera-extensions:${camerax_version}")

    // com.google.common
//    implementation "com.google.guava:guava:31.1-android"

    // permission
    implementation("com.google.accompanist:accompanist-permissions:0.32.0")

    // glide
    implementation("com.github.bumptech.glide:compose:1.0.0-alpha.1")

    // material3
    implementation("androidx.compose.material3:material3")

    // Nemonic printer (old)
//    implementation files("./libs/nemonic.aar")

    // Nemonic printer (new)
    implementation files("./libs/NemonicSdk.aar")

    // BPbio
    implementation files("./libs/BPBIO_SDK.jar")

    // QR Code (ZXing core)
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    // System UI Controller
    implementation("com.google.accompanist:accompanist-systemuicontroller:0.32.0")

    // location
    implementation("com.google.android.gms:play-services-location:21.3.0")

    // MPAndroidChart
    implementation("com.github.PhilJay:MPAndroidChart:v3.1.0")

    // Exo Player
    implementation("androidx.media3:media3-exoplayer:1.8.0")
    implementation("androidx.media3:media3-ui:1.8.0")
    implementation("androidx.media3:media3-common:1.8.0")
//    implementation 'androidx.media3:media3-*:1.0.1'

    // Retrofit
    implementation("com.squareup.retrofit2:retrofit:3.0.0")

    // GSON
    implementation("com.squareup.retrofit2:converter-gson:3.0.0")

    // Jackson
    implementation "com.fasterxml.jackson.core:jackson-core:2.19.2"
    implementation "com.fasterxml.jackson.core:jackson-annotations:2.19.2"
    implementation "com.fasterxml.jackson.core:jackson-databind:2.19.2"
    implementation "com.fasterxml.jackson.module:jackson-module-kotlin:2.19.2"

    // Pager
    implementation("com.google.accompanist:accompanist-pager:0.12.0")

    // Hilt
    implementation("androidx.hilt:hilt-lifecycle-viewmodel-compose:1.3.0")
    implementation("com.google.dagger:hilt-android:2.56.2")
    kapt("com.google.dagger:hilt-android-compiler:2.56.2")

    // Orbit MVI
    implementation("org.orbit-mvi:orbit-core:10.0.0")
    implementation("org.orbit-mvi:orbit-viewmodel:10.0.0")
    implementation("org.orbit-mvi:orbit-compose:10.0.0")
    testImplementation("org.orbit-mvi:orbit-test:10.0.0")

    implementation("androidx.appcompat:appcompat:1.6.1")

    implementation("androidx.compose.material:material-icons-core:1.5.4")
    implementation("androidx.compose.material:material-icons-extended:1.5.4") // 확장 아이콘

    // --- Room ---
//    implementation("androidx.room:room-runtime:2.6.1")
//    implementation("androidx.room:room-ktx:2.6.1")
//    kapt("androidx.room:room-compiler:2.6.1")
//    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0")
}

kapt {
    correctErrorTypes = true
    arguments {
        arg("dagger.fastInit", "enabled")
        arg("dagger.hilt.android.internal.disableAndroidSuperclassValidation", "true")
        arg("dagger.hilt.internal.useAggregatingRootProcessor", "true")
    }
}
